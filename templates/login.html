<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label for="duke_netid">Duke NetID:</label>
        <input type="text" id="duke_netid" name="duke_netid" required><br><br>
        <label for="access_code">Access Code:</label>
        <input type="password" id="access_code" name="access_code" required><br><br>
        <button type="submit">Login</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <title>Scenario Voting</title>
    <style>
        .scenario-row {
            display: grid;
            grid-template-columns: 50% 10% 10% 10%;
            align-items: center;
            padding: 10px;
        }
        .scenario-row:nth-child(even) {
            background-color: #f0f0f0;
        }
        .scenario-row:nth-child(odd) {
            background-color: white;
        }
        .radio-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Scenario Voting</h1>
    <form method="POST">
        {% for scenario, id in zip(scenarios, scenario_ids) %}
        <div class="scenario-row">
            <input type="hidden" name="scenario_id_{{ loop.index0 }}" value="{{ id }}">
            <span>{{ scenario }}</span>
            <div class="radio-group">
                <input type="radio" id="yes_{{ loop.index0 }}" name="vote_{{ loop.index0 }}" value="yes" required>
                <label for="yes_{{ loop.index0 }}">Yes</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="no_{{ loop.index0 }}" name="vote_{{ loop.index0 }}" value="no">
                <label for="no_{{ loop.index0 }}">No</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="maybe_{{ loop.index0 }}" name="vote_{{ loop.index0 }}" value="maybe">
                <label for="maybe_{{ loop.index0 }}">Maybe</label>
            </div>
        </div>
        {% endfor %}
        <button type="submit">Submit Votes</button>
    </form>
</body>
</html></html>
